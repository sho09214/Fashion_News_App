<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>トップページ(仮)</title>
  <link rel="stylesheet" th:href="@{/css/style-top.css}">
</head>
<body>
<!-- ヘッダー -->
<header class="header">
  <div class="container">
    <div class="header-content">
      <div class="logo">👗 ファッションニュース</div>
      <div class="user-menu">
        <a th:href="@{/mytag}" class="btn btn-outline">マイタグ管理</a>
        <a th:href="@{/favorite}" class="btn btn-outline">お気に入り</a>
        <a th:href="@{/mypage}" class="btn btn-outline">マイページ</a>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="main-content">
    <!-- サイドバー - フィルター -->
    <aside class="sidebar">
      <div class="filter-section">
        <div class="filter-title">マイタグでフィルター</div>
        <div class="tag-list">
          <div class="tag-item" th:each="mytag : ${mytagList}">
            <div class="tag-color" style="background-color: #FF6B6B;"></div>
            <span class="tag-name" th:text="${mytag.tagName}"></span>
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="filter-title">ソート</div>
        <select class="btn" style="width: 100%; padding: 0.5rem;">
          <option>新着順</option>
          <option>人気順</option>
          <option>お気に入り順</option>
        </select>
      </div>
    </aside>

    <!-- ニュース一覧 -->
    <main class="news-grid">
      <article class="news-card" th:each="news : ${newsList}">
        <div class="news-title">
          <img src="https://via.placeholder.com/400x200/667eea/white?text=Fashion+News"
               alt="春の新作コート" class="news-image">
          <button class="favorite-btn">♥</button>
        </div>
        <div class="news-content">
          <div class="news-source">
            <span class="source-name">VOGUE Japan</span>
            <span class="news-date">2024年1月20日</span>
          </div>
          <h3 class="news-title" th:text="${news.title}">ニュースタイトル</h3>
          <p class="news-description" th:text="${news.description}">ニュースの説明</p>
          <div class="news-footer">
            <div class="news-tags">
              <span class="news-tag" style="background-color: #FF6B6B; color: white;">春コート</span>
              <span class="news-tag" style="background-color: #4ECDC4; color: white;">トレンドカラー</span>
            </div>
          </div>
        </div>
      </article>

      <!-- ローディング状態の例 -->
      <div class="loading" id="loadingIndicator" style="display: none;">
        <div style="margin-bottom: 1rem;">ニュースを読み込み中...</div>
        <div class="skeleton" style="height: 200px; margin-bottom: 1rem;"></div>
        <div class="skeleton" style="height: 100px;"></div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
